<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Trias Oceanic</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0F3D2E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: 'Montserrat', system-ui, sans-serif;
        color: #13241f;
        background: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.65;
      }
      .box { max-width: 520px; }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #4b5a54;
      }
      h1 {
        font-weight: 800;
        text-transform: uppercase;
        line-height: 1.05;
        font-size: clamp(2rem, 6vw, 3rem);
        margin-top: 14px;
      }
      h1 span { color: #b5793f; }
      p { margin-top: 18px; color: #4b5a54; }
      .row { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 14px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 14px 26px;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .btn-copper { background: #b5793f; color: #fff; }
      .btn-ghost { border-color: #e2e7e4; color: #13241f; }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="eyebrow">404 · Page not found</p>
      <h1>This hole came up <span>dry.</span></h1>
      <p>The page you are after does not exist or has moved. The catalogue and contact form are still where they should be.</p>
      <div class="row">
        <a class="btn btn-copper" href="/products/">Browse the catalogue</a>
        <a class="btn btn-ghost" href="/">Back to home</a>
      </div>
    </div>
  </body>
</html>
